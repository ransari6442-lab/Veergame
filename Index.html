<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEERGAME</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, #087a40 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, #8b1010 0%, transparent 40%),
        linear-gradient(135deg, #021b0e, #063d20, #310505);
      color: #fff;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .logo {
      font-size: 50px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #00ff88, #ffffff, #ff3333);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h2 {
      margin-top: 15px;
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(90deg, #ff3333, #ffffff, #00ff88);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .bonus-text {
      margin: 30px 0;
      font-size: 38px;
      font-weight: 900;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00ff88, #ffffff, #ff3333);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      animation: glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        transform: scale(1);
        filter: drop-shadow(0 0 5px #00ff88);
      }

      to {
        transform: scale(1.06);
        filter:
          drop-shadow(0 0 12px #00ff88)
          drop-shadow(0 0 20px #ff3333);
      }
    }

    .notes {
      max-width: 380px;
      margin: 0 auto 30px;
      text-align: left;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.8;
    }

    .notes div {
      margin: 8px 0;
    }

    .check {
      color: #00ff88;
      margin-right: 8px;
    }

    .button {
      display: inline-block;
      padding: 15px 35px;
      background: #ffffff;
      color: #07552f;
      border-radius: 50px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      transition: 0.25s;
      box-shadow: 0 5px 20px rgba(255, 255, 255, 0.25);
    }

    .button:hover {
      transform: scale(1.06);
      box-shadow: 0 8px 30px rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 450px) {
      .logo {
        font-size: 40px;
      }

      h2 {
        font-size: 22px;
      }

      .bonus-text {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">VEERGAME</div>

    <h2>WELCOME TO VEERGAME</h2>

    <div class="bonus-text">
      🎁 BONUS AVAILABLE 🎁
    </div>

    <div class="notes">
      <div>
        <span class="check">✓</span>
        Create your account
      </div>

      <div>
        <span class="check">✓</span>
        Explore the platform
      </div>

      <div>
        <span class="check">✓</span>
        Check available features
      </div>

      <div>
        <span class="check">✓</span>
        See eligibility and terms
      </div>
    </div>

    <a href="#" class="button">REGISTERED NOW</a>

  </div>

</body>
</html>
